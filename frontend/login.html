<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to THE HALL CINEMAS — book tickets, manage your account">
    <title>Sign In | THE HALL CINEMAS</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="./shared/css/preloader.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="./shared/js/preloader.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <!-- Background -->
    <div class="auth-bg"></div>

    <!-- Film strip -->
    <div class="film-strip" aria-hidden="true">
        <div class="film-hole"></div><div class="film-hole"></div><div class="film-hole"></div>
        <div class="film-hole"></div><div class="film-hole"></div><div class="film-hole"></div>
        <div class="film-hole"></div><div class="film-hole"></div><div class="film-hole"></div>
        <div class="film-hole"></div><div class="film-hole"></div><div class="film-hole"></div>
        <div class="film-hole"></div><div class="film-hole"></div><div class="film-hole"></div>
        <div class="film-hole"></div><div class="film-hole"></div><div class="film-hole"></div>
    </div>

    <!-- Main -->
    <div class="auth-page">

        <!-- Brand -->
        <a href="index.html" class="auth-brand" aria-label="THE HALL CINEMAS home">
            <span class="brand-r">THE HALL</span><span class="brand-w"> CINEMAS</span>
        </a>

        <!-- Card -->
        <div class="auth-card" role="main">

            <!-- Header -->
            <div class="card-header">
                <div class="card-icon"><i class="fas fa-film"></i></div>
                <h1 class="card-title">WELCOME BACK</h1>
                <p class="card-subtitle">Sign in to your account to book tickets</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>

                <!-- Email -->
                <div class="field-group">
                    <label class="field-label" for="email">Email Address</label>
                    <div class="field-wrap">
                        <input
                            type="email" id="email" class="form-input"
                            placeholder="your@email.com" required autocomplete="email">
                        <i class="fas fa-envelope field-icon"></i>
                    </div>
                    <div class="error-msg" id="emailError"><i class="fas fa-exclamation-circle"></i><span></span></div>
                </div>

                <!-- Password -->
                <div class="field-group">
                    <label class="field-label" for="password">Password</label>
                    <div class="field-wrap">
                        <input
                            type="password" id="password" class="form-input"
                            placeholder="Enter your password" required autocomplete="current-password">
                        <i class="fas fa-lock field-icon"></i>
                        <button type="button" class="pass-toggle" id="togglePassword" tabindex="-1" aria-label="Toggle password visibility">
                            <i class="fas fa-eye-slash"></i>
                        </button>
                    </div>
                    <div class="error-msg" id="passwordError"><i class="fas fa-exclamation-circle"></i><span></span></div>
                </div>

                <!-- Actions -->
                <div class="form-actions">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberMe"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <!-- Submit -->
                <button type="submit" class="submit-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> SIGN IN
                </button>
<button type="button" class="google-btn" id="googleLoginBtn">
    <i class="fab fa-google"></i> CONTINUE WITH GOOGLE
</button>
            </form>

            <!-- OTP Form (Hidden by default) -->
            <form id="otpForm" novalidate style="display: none;">
                <div class="card-header" style="margin-bottom: 20px; padding: 0;">
                    <div class="card-icon"><i class="fas fa-shield-alt"></i></div>
                    <h1 class="card-title" style="font-size: 22px;">2-STEP VERIFICATION</h1>
                    <p class="card-subtitle">We sent a 6-digit code to <strong id="otpEmailDisplay" style="color: #fff;"></strong></p>
                </div>

                <div class="field-group">
                    <label class="field-label" for="otpCode">Verification Code</label>
                    <div class="field-wrap">
                        <input
                            type="text" id="otpCode" class="form-input"
                            placeholder="Enter 6-digit code" required autocomplete="one-time-code" maxlength="6" pattern="\d{6}" style="letter-spacing: 4px; font-weight: bold; text-align: center; font-size: 18px; padding-left: 14px;">
                        <i class="fas fa-key field-icon" style="display: none;"></i>
                    </div>
                    <div class="error-msg" id="otpCodeError"><i class="fas fa-exclamation-circle"></i><span></span></div>
                </div>

                <button type="submit" class="submit-btn" id="verifyOtpBtn" style="margin-top: 10px;">
                    <i class="fas fa-check-circle"></i> VERIFY & SIGN IN
                </button>

                <div style="margin-top: 20px; text-align: center;">
                    <a href="#" id="backToLogin" class="forgot-link" style="color: var(--text-secondary); font-size: 12.5px;">Back to Sign In</a>
                </div>
            </form>

            <!-- Divider -->
            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">OR</span>
                <div class="divider-line"></div>
            </div>

            <!-- Footer -->
            <div class="auth-footer-link">
                Don't have an account? <a href="register.html">Create one free</a>
            </div>

        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
