<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="THE HALL CINEMASs — Admin Portal Login. Authorized personnel only.">
    <title>Admin Login | THE HALL CINEMASs</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        /* ---- Admin Auth Page ---- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --admin-accent: #f9a825;
            --admin-accent-light: #fdd835;
            --admin-accent-dark: #f57f17;
            --admin-accent-glow: rgba(249, 168, 37, 0.3);
            --admin-accent-soft: rgba(249, 168, 37, 0.1);
            --dark-bg: #07080a;
            --dark-surface: #0f1114;
            --glass-bg: rgba(12, 13, 17, 0.96);
            --glass-blur: blur(24px);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-accent: rgba(249, 168, 37, 0.2);
            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.38);
            --font-display: 'Oswald', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-md: 8px;
            --radius-lg: 12px;
            --danger: #ef5350;
            --danger-soft: rgba(239, 83, 80, 0.12);
        }

        body {
            background: var(--dark-bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ---- Animated background ---- */
        .admin-auth-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .admin-auth-bg::before {
            content: '';
            position: absolute;
            top: -25%;
            right: -15%;
            width: 650px;
            height: 650px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(249, 168, 37, 0.1) 0%, transparent 70%);
            animation: adminBlobFloat 9s ease-in-out infinite alternate;
        }

        .admin-auth-bg::after {
            content: '';
            position: absolute;
            bottom: -25%;
            left: -10%;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(249, 168, 37, 0.06) 0%, transparent 70%);
            animation: adminBlobFloat 12s ease-in-out infinite alternate-reverse;
        }

        @keyframes adminBlobFloat {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(25px, 15px) scale(1.04);
            }
        }

        /* Grid pattern overlay */
        .grid-pattern {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(249, 168, 37, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(249, 168, 37, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.5;
        }

        /* Security bars decoration */
        .security-strip {
            position: fixed;
            top: 0;
            left: 0;
            width: 4px;
            height: 100vh;
            background: linear-gradient(180deg,
                    transparent 0%,
                    var(--admin-accent-dark) 20%,
                    var(--admin-accent) 50%,
                    var(--admin-accent-dark) 80%,
                    transparent 100%);
            opacity: 0.3;
            z-index: 0;
        }

        .security-strip-right {
            left: auto;
            right: 0;
        }

        /* ---- Page wrapper ---- */
        .admin-auth-page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* ---- Top brand ---- */
        .admin-auth-brand {
            font-family: var(--font-display);
            font-size: 20px;
            letter-spacing: 5px;
            text-decoration: none;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-auth-brand .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--admin-accent), var(--admin-accent-dark));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #0a0a0a;
        }

        .admin-auth-brand .brand-a {
            color: var(--admin-accent);
        }

        .admin-auth-brand .brand-w {
            color: #fff;
        }

        /* Security badge */
        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--admin-accent-soft);
            border: 1px solid var(--border-accent);
            border-radius: 20px;
            padding: 5px 14px;
            font-family: var(--font-display);
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--admin-accent);
            margin-bottom: 28px;
        }

        .security-badge i {
            font-size: 9px;
        }

        /* ---- Card ---- */
        .admin-auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-subtle);
            border-top: 2px solid var(--admin-accent);
            border-radius: 16px;
            padding: 40px 36px 36px;
            box-shadow:
                0 24px 64px rgba(0, 0, 0, 0.85),
                0 0 60px rgba(249, 168, 37, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .admin-card-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .admin-card-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, rgba(249, 168, 37, 0.2), rgba(245, 127, 23, 0.1));
            border: 1px solid rgba(249, 168, 37, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--admin-accent);
            margin: 0 auto 18px;
            position: relative;
        }

        .admin-card-icon::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 20px;
            border: 1px solid rgba(249, 168, 37, 0.1);
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        .admin-card-title {
            font-family: var(--font-display);
            font-size: 26px;
            letter-spacing: 3px;
            font-weight: 600;
            color: #fff;
        }

        .admin-card-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        /* ---- Form elements ---- */
        .field-group {
            margin-bottom: 18px;
            position: relative;
        }

        .field-label {
            display: block;
            font-family: var(--font-display);
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 7px;
        }

        .field-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-icon {
            position: absolute;
            left: 13px;
            color: var(--text-muted);
            font-size: 13px;
            pointer-events: none;
            transition: color 0.2s;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 14px;
            transition: all 0.2s ease;
            -webkit-text-fill-color: var(--text-primary);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--admin-accent-dark);
            box-shadow: 0 0 0 3px var(--admin-accent-glow);
        }

        .form-input:focus~.field-icon,
        .field-wrap:focus-within .field-icon {
            color: var(--admin-accent);
        }

        .form-input.error {
            border-color: var(--danger);
            background: var(--danger-soft);
        }

        .form-input.success {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.06);
        }

        /* password toggle */
        .pass-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 4px;
            transition: color 0.15s;
        }

        .pass-toggle:hover {
            color: var(--text-secondary);
        }

        .error-msg {
            display: none;
            font-size: 11.5px;
            color: #ef9a9a;
            margin-top: 5px;
            align-items: center;
            gap: 5px;
        }

        .error-msg.show {
            display: flex;
        }

        .error-msg i {
            font-size: 11px;
        }

        /* ---- Submit button ---- */
        .admin-submit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--admin-accent) 0%, var(--admin-accent-dark) 100%);
            border: none;
            border-radius: var(--radius-md);
            color: #0a0a0a;
            font-family: var(--font-display);
            font-size: 13.5px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 18px rgba(249, 168, 37, 0.3);
            margin-top: 6px;
        }

        .admin-submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(249, 168, 37, 0.45);
            background: linear-gradient(135deg, var(--admin-accent-light) 0%, var(--admin-accent) 100%);
        }

        .admin-submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .admin-submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ---- Divider ---- */
        .admin-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0 18px;
        }

        .admin-divider-line {
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }

        .admin-divider-text {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            font-family: var(--font-display);
        }

        /* ---- Footer link ---- */
        .admin-auth-footer {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .admin-auth-footer a {
            color: var(--admin-accent);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s;
        }

        .admin-auth-footer a:hover {
            color: var(--admin-accent-light);
        }

        /* ---- Access notice ---- */
        .access-notice {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(249, 168, 37, 0.06);
            border: 1px solid rgba(249, 168, 37, 0.12);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            margin-bottom: 22px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.4;
        }

        .access-notice i {
            color: var(--admin-accent);
            font-size: 14px;
            flex-shrink: 0;
        }

        /* ---- Responsive ---- */
        @media (max-width: 480px) {
            .admin-auth-card {
                padding: 28px 20px;
            }

            .security-strip {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="admin-auth-bg"></div>
    <div class="grid-pattern"></div>

    <!-- Security strips -->
    <div class="security-strip" aria-hidden="true"></div>
    <div class="security-strip security-strip-right" aria-hidden="true"></div>

    <!-- Main -->
    <div class="admin-auth-page">

        <!-- Brand -->
        <a href="../frontend/index.html" class="admin-auth-brand" aria-label="THE HALL CINEMASs home">
            <span class="brand-icon"><i class="fas fa-film"></i></span>
            <span><span class="brand-a">THE HALL</span><span class="brand-w"> CINEMAS</span></span>
        </a>

        <!-- Security badge -->
        <div class="security-badge">
            <i class="fas fa-lock"></i>
            RESTRICTED ACCESS
        </div>

        <!-- Card -->
        <div class="admin-auth-card" role="main">

            <!-- Header -->
            <div class="admin-card-header">
                <div class="admin-card-icon"><i class="fas fa-shield-alt"></i></div>
                <h1 class="admin-card-title">ADMIN PORTAL</h1>
                <p class="admin-card-subtitle">Authorized personnel only</p>
            </div>

            <!-- Access Notice -->
            <div class="access-notice">
                <i class="fas fa-info-circle"></i>
                <span>This login is restricted to administrator accounts. Customer accounts cannot access this
                    portal.</span>
            </div>

            <!-- Login Form -->
            <form id="adminLoginForm" novalidate>

                <!-- Email -->
                <div class="field-group">
                    <label class="field-label" for="admin-email">Admin Email</label>
                    <div class="field-wrap">
                        <input type="email" id="admin-email" class="form-input" placeholder="admin@thehallcinemas.com" required
                            autocomplete="email">
                        <i class="fas fa-user-shield field-icon"></i>
                    </div>
                    <div class="error-msg" id="admin-emailError"><i class="fas fa-exclamation-circle"></i><span></span>
                    </div>
                </div>

                <!-- Password -->
                <div class="field-group">
                    <label class="field-label" for="admin-password">Password</label>
                    <div class="field-wrap">
                        <input type="password" id="admin-password" class="form-input" placeholder="Enter your password"
                            required autocomplete="current-password">
                        <i class="fas fa-lock field-icon"></i>
                        <button type="button" class="pass-toggle" id="adminTogglePassword" tabindex="-1"
                            aria-label="Toggle password visibility">
                            <i class="fas fa-eye-slash"></i>
                        </button>
                    </div>
                    <div class="error-msg" id="admin-passwordError"><i
                            class="fas fa-exclamation-circle"></i><span></span></div>
                </div>

                <!-- Submit -->
                <button type="submit" class="admin-submit-btn" id="adminLoginBtn">
                    <i class="fas fa-sign-in-alt"></i> ACCESS DASHBOARD
                </button>
            </form>

            <!-- Divider -->
            <div class="admin-divider">
                <div class="admin-divider-line"></div>
                <span class="admin-divider-text">THE HALL CINEMASS</span>
                <div class="admin-divider-line"></div>
            </div>

            <!-- Footer -->
            <div class="admin-auth-footer">
                Not an admin? <a href="../frontend/login.html">Customer login →</a>
            </div>

        </div>
    </div>

    <script src="js/admin-auth.js"></script>
</body>

</html>
