<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Shows | THE HALL CINEMAS Admin</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="../shared/css/global.css">
    <link rel="stylesheet" href="../shared/css/components.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/shows.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="admin-layout">
        <!-- SIDEBAR (injected via JS) -->
        <div id="sidebar-container"></div>
        <main class="admin-main">
            <div class="hdr">
                <h1>Manage Shows</h1>
                <div class="hdr-time"><i class="far fa-clock"></i> <span id="clock"></span></div>
            </div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-lbl">Total Shows</div>
                    <div class="stat-val" id="s-total">0</div>
                </div>
                <div class="stat">
                    <div class="stat-lbl">Today's Shows</div>
                    <div class="stat-val" id="s-today">0</div>
                </div>
                <div class="stat">
                    <div class="stat-lbl">Active Now</div>
                    <div class="stat-val" id="s-active">0</div>
                </div>
                <div class="stat">
                    <div class="stat-lbl">Avg. Occupancy</div>
                    <div class="stat-val" id="s-occ">0%</div>
                </div>
            </div>
            <div class="filters">
                <input type="text" class="flt" id="f-search" placeholder="Search movie...">
                <input type="date" class="flt" id="f-date" style="min-width:130px">
                <select class="flt" id="f-screen">
                    <option value="">All Screens</option>
                    <option value="imax">IMAX</option>
                    <option value="dolby">Dolby</option>
                    <option value="standard">Standard</option>
                    <option value="deluxe">Deluxe</option>
                </select>
                <select class="flt" id="f-status">
                    <option value="">All Statuses</option>
                    <option value="active">Active</option>
                    <option value="upcoming">Upcoming</option>
                    <option value="ended">Ended</option>
                    <option value="sold-out">Sold Out</option>
                </select>
                <button class="btn-add" id="btn-add"><i class="fas fa-plus"></i> Add Show</button>
            </div>
            <div class="tbl-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Movie</th>
                            <th>Date & Time</th>
                            <th>Hall / Screen</th>
                            <th>Price</th>
                            <th>Occupancy</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
                <div class="tbl-foot" id="tbl-foot">Showing 0 shows</div>
            </div>
        </main>
    </div>
    <div class="modal-bg" id="modal-bg">
        <div class="mdl">
            <div class="mdl-hd">
                <h3 id="m-title">Add New Show</h3><button class="mdl-x" id="m-close"><i
                        class="fas fa-times"></i></button>
            </div>
            <div class="mdl-bd" id="m-body"></div>
            <div class="mdl-ft" id="m-foot"></div>
        </div>
    </div>
    <script src="js/sidebar-loader.js"></script>
    <script src="js/Shows.js"></script>
</body>

</html>
